[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studypilot-desk"
version = "0.2.1"
description = "Local-first learning operations desktop backend"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.11,<3",
  "python-docx>=1.2,<2",
  "pypdf>=6.14.2,<7",
  "python-multipart>=0.0.20,<1",
  "Pillow>=11.3,<13",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pyinstaller>=6.16,<7",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
  "reportlab>=4.4,<5",
  "uvicorn[standard]>=0.35,<1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
