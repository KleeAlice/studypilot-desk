        <path d="M25 8a17 17 0 1 1-13 6" fill="none" stroke="#55CDB3" stroke-width="4" stroke-linecap="round"/>
        <text x="25" y="29" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800">31%</text>
