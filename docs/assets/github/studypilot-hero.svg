    <g transform="translate(682 150)">
      <text x="0" y="14" fill="#172033" font-size="18" font-weight="800">学习中心</text>
      <text x="0" y="38" fill="#7C8799" font-size="11">围绕本周目标，每次只推进一个知识点。</text>
      <rect x="548" y="-2" width="97" height="34" rx="11" fill="#5C6FEF"/>
      <text x="596.5" y="19" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">继续学习 →</text>

      <rect x="0" y="58" width="645" height="82" rx="16" fill="#101B2E"/>
      <text x="18" y="81" fill="#8E9EFF" font-size="9" font-weight="800" letter-spacing="1.5">COURSE LEARNING PATH</text>
