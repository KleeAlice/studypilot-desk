      <path d="M541 335h14l-3 12h-8Z" fill="none" stroke="#93A0B2" stroke-width="1.7"/>
      <text x="565" y="344">Python 实验</text>
      <circle cx="548" cy="382" r="7" fill="none" stroke="#93A0B2" stroke-width="1.7"/>
      <path d="M548 375v7l5 3" fill="none" stroke="#93A0B2" stroke-width="1.5" stroke-linecap="round"/>
      <text x="565" y="386">复习统计</text>
    </g>
    <rect x="528" y="591" width="114" height="43" rx="12" fill="#F8FAFC" stroke="#DDE3EC"/>
    <circle cx="548" cy="612" r="8" fill="#4FCBB1" fill-opacity="0.18"/>
