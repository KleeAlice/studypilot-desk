<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">StudyPilot Desk — 本地优先桌面学习系统</title>
  <desc id="desc">品牌化桌面界面插画，展示学习中心、学习路线和本地资料书架。</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1360" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B1830"/>
      <stop offset="1" stop-color="#10223A"/>
    </linearGradient>
    <radialGradient id="indigoGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1048 158) rotate(141) scale(684 455)">
      <stop stop-color="#6678FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6678FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(333 668) rotate(-29) scale(479 292)">
      <stop stop-color="#52D2B5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#52D2B5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="78" y1="45" x2="146" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8290FF"/>
      <stop offset="1" stop-color="#5365E7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#EEF2FF" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="lesson" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4F6FF"/>
      <stop offset="1" stop-color="#EEF7F6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6073F4"/>
      <stop offset="1" stop-color="#4BC7AE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#BFD0EA" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#02060D" flood-opacity="0.42"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#0B1730" flood-opacity="0.22"/>
    </filter>
    <clipPath id="windowClip"><rect x="512" y="64" width="854" height="592" rx="30"/></clipPath>
  </defs>

  <rect width="1440" height="720" rx="34" fill="url(#bg)"/>
  <rect width="1440" height="720" rx="34" fill="url(#grid)"/>
  <rect width="1440" height="720" rx="34" fill="url(#indigoGlow)"/>
  <rect width="1440" height="720" rx="34" fill="url(#mintGlow)"/>
  <path d="M35 584C242 477 364 563 512 474S797 251 1006 272s253 70 399-29" fill="none" stroke="#8797FF" stroke-opacity="0.1" stroke-width="2"/>
  <path d="M31 615C249 503 391 604 548 501s276-177 471-158 244 58 388-36" fill="none" stroke="#5AD2B9" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Brand column -->
  <g font-family="'Segoe UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <g transform="translate(72 54)">
      <rect width="70" height="70" rx="20" fill="url(#logo)"/>
      <circle cx="35" cy="35" r="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25"/>
      <path d="M35 13 40 30 57 35 40 40 35 57 30 40 13 35 30 30 35 13Z" fill="#FFFFFF" fill-opacity="0.2"/>
      <circle cx="35" cy="35" r="8.5" fill="#FFFFFF"/>
      <circle cx="35" cy="35" r="3.5" fill="#596AE9"/>
      <circle cx="58" cy="12" r="6" fill="#5AD2B9"/>
    </g>
    <text x="162" y="81" fill="#F7F9FF" font-size="23" font-weight="700" letter-spacing="0.2">StudyPilot Desk</text>
    <text x="162" y="106" fill="#91A3BE" font-size="12" font-weight="600" letter-spacing="2.4">LOCAL LEARNING OPERATING SYSTEM</text>

    <g transform="translate(72 161)" font-size="11" font-weight="700" letter-spacing="1.1">
      <rect width="78" height="28" rx="14" fill="#7182FF" fill-opacity="0.13" stroke="#8290FF" stroke-opacity="0.34"/>
      <text x="39" y="18" text-anchor="middle" fill="#AEB8FF">WINDOWS</text>
      <rect x="87" width="102" height="28" rx="14" fill="#4DD0B4" fill-opacity="0.11" stroke="#52D2B5" stroke-opacity="0.32"/>
      <text x="138" y="18" text-anchor="middle" fill="#8DE5D1">LOCAL-FIRST</text>
      <rect x="198" width="108" height="28" rx="14" fill="#F1B563" fill-opacity="0.1" stroke="#F1B563" stroke-opacity="0.28"/>
      <text x="252" y="18" text-anchor="middle" fill="#F5CA8E">AI-ASSISTED</text>
    </g>

    <text x="72" y="254" fill="#F8FAFF" font-size="50" font-weight="800" letter-spacing="-1.5">让每一次学习</text>
    <text x="72" y="316" fill="#F8FAFF" font-size="50" font-weight="800" letter-spacing="-1.5">都有清晰的下一步。</text>
    <text x="73" y="361" fill="#AAB8CC" font-size="17">把课程、资料、AI 对话、知识沉淀与复习</text>
    <text x="73" y="389" fill="#AAB8CC" font-size="17">组织成一个持续推进的本地学习工作台。</text>

    <g transform="translate(72 438)">
      <circle cx="8" cy="9" r="8" fill="#6275F2"/>
      <path d="M5 9l2 2 4-5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="14" fill="#DCE4F1" font-size="14" font-weight="600">课程上下文集中在一个桌面工作区</text>
      <circle cx="8" cy="45" r="8" fill="#4FCBB1"/>
      <path d="M5 45l2 2 4-5" fill="none" stroke="#071A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="50" fill="#DCE4F1" font-size="14" font-weight="600">从资料导入到掌握复习形成闭环</text>
      <circle cx="8" cy="81" r="8" fill="#F0B665"/>
      <path d="M5 81l2 2 4-5" fill="none" stroke="#241609" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="86" fill="#DCE4F1" font-size="14" font-weight="600">默认本地存储，学习数据由你掌控</text>
    </g>

    <g transform="translate(72 574)">
      <rect width="126" height="75" rx="16" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="17" y="28" fill="#FFFFFF" font-size="25" font-weight="800">6</text>
      <text x="42" y="28" fill="#91A3BE" font-size="11" font-weight="700">CORE SPACES</text>
      <text x="17" y="54" fill="#B9C5D6" font-size="12">学习工作区</text>
      <rect x="136" width="145" height="75" rx="16" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="153" y="28" fill="#FFFFFF" font-size="25" font-weight="800">100%</text>
      <text x="153" y="54" fill="#B9C5D6" font-size="12">本地数据优先</text>
      <rect x="291" width="133" height="75" rx="16" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="308" y="28" fill="#FFFFFF" font-size="25" font-weight="800">1</text>
      <text x="329" y="28" fill="#91A3BE" font-size="11" font-weight="700">DESKTOP</text>
      <text x="308" y="54" fill="#B9C5D6" font-size="12">完整学习闭环</text>
    </g>
  </g>

  <!-- Product window -->
  <g clip-path="url(#windowClip)" font-family="'Segoe UI','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <rect x="512" y="64" width="854" height="592" rx="30" fill="#F7F8FC"/>
    <rect x="512" y="64" width="854" height="62" fill="#FFFFFF"/>
    <line x1="512" y1="126" x2="1366" y2="126" stroke="#DDE3EE"/>
    <circle cx="540" cy="95" r="6" fill="#FF857A"/>
    <circle cx="560" cy="95" r="6" fill="#F2C96B"/>
    <circle cx="580" cy="95" r="6" fill="#5FD1B1"/>
    <rect x="607" y="80" width="28" height="28" rx="8" fill="#596AE9"/>
    <text x="621" y="99" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">SP</text>
    <text x="647" y="99" fill="#1B2433" font-size="14" font-weight="700">线性代数基础</text>
    <rect x="798" y="79" width="108" height="31" rx="15.5" fill="#EEF1FF"/>
    <circle cx="817" cy="94.5" r="5" fill="#57CDB2"/>
    <text x="830" y="99" fill="#536077" font-size="11" font-weight="600">本地服务正常</text>
    <rect x="1248" y="79" width="88" height="31" rx="10" fill="#F3F5F9" stroke="#DCE2EC"/>
    <text x="1292" y="99" text-anchor="middle" fill="#536077" font-size="11" font-weight="600">第 3 周</text>

    <rect x="512" y="126" width="146" height="530" fill="#EEF1F6"/>
    <g fill="#7D899B" font-size="11" font-weight="600">
      <rect x="528" y="148" width="114" height="42" rx="12" fill="#DDE4FF"/>
      <circle cx="548" cy="169" r="7" fill="#6073F4"/>
      <text x="565" y="173" fill="#485BD1">学习中心</text>
      <circle cx="548" cy="218" r="7" fill="none" stroke="#93A0B2" stroke-width="2"/>
