      <rect x="0" y="157" width="422" height="322" rx="18" fill="url(#lesson)" stroke="#DCE3F0"/>
      <rect x="0" y="157" width="4" height="322" rx="2" fill="#6073F4"/>
      <text x="20" y="184" fill="#5B6EEA" font-size="9" font-weight="800" letter-spacing="1.4">这次只学一个点</text>
      <text x="20" y="215" fill="#182033" font-size="20" font-weight="800">矩阵乘法的几何意义</text>
      <text x="20" y="243" fill="#5F6A7C" font-size="11">把矩阵看作空间变换，而不仅是一组数字。</text>
      <rect x="20" y="260" width="380" height="61" rx="12" fill="#FFFFFF" fill-opacity="0.82" stroke="#DCE3EE"/>
      <rect x="34" y="275" width="3" height="31" rx="1.5" fill="#5ACDB3"/>
      <text x="48" y="287" fill="#566174" font-size="9.5">一个矩阵先改变基向量，再把同样的变化</text>
      <text x="48" y="302" fill="#566174" font-size="9.5">扩展到整个空间中的每个向量。</text>
      <text x="20" y="348" fill="#6475EB" font-size="9" font-weight="800" letter-spacing="1.2">选择题 · 四选一</text>
      <text x="20" y="374" fill="#20283A" font-size="12" font-weight="700">下列哪一项最准确描述矩阵乘法？</text>
      <g font-size="9.5" fill="#4E596B">
        <rect x="20" y="389" width="184" height="34" rx="9" fill="#FFFFFF" stroke="#D9E0EB"/>
        <circle cx="36" cy="406" r="6" fill="none" stroke="#99A3B2"/>
        <text x="50" y="410">按顺序组合空间变换</text>
        <rect x="214" y="389" width="186" height="34" rx="9" fill="#FFFFFF" stroke="#D9E0EB"/>
        <circle cx="230" cy="406" r="6" fill="none" stroke="#99A3B2"/>
        <text x="244" y="410">只对数字进行加法</text>
      </g>
      <rect x="20" y="436" width="380" height="28" rx="9" fill="#5D70EF"/>
      <text x="210" y="454" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">提交答案</text>

      <rect x="438" y="157" width="207" height="322" rx="18" fill="#FFFFFF" stroke="#DCE3EE"/>
      <text x="458" y="185" fill="#1E2738" font-size="13" font-weight="800">本次参考资料</text>
      <text x="609" y="185" text-anchor="end" fill="#6A79E9" font-size="9" font-weight="700">已选 3 份</text>
      <g transform="translate(458 205)">
        <rect width="167" height="62" rx="11" fill="#F6F8FC" stroke="#E1E6EF"/>
        <rect x="10" y="11" width="29" height="40" rx="6" fill="#E4E8FF"/>
        <text x="24.5" y="35" text-anchor="middle" fill="#5D70EA" font-size="8" font-weight="800">PDF</text>
        <text x="50" y="25" fill="#30394B" font-size="9.5" font-weight="700">线性代数讲义</text>
        <text x="50" y="42" fill="#8C96A5" font-size="8.5">第 3 章 · 变换</text>
        <rect y="72" width="167" height="62" rx="11" fill="#F6F8FC" stroke="#E1E6EF"/>
        <rect x="10" y="83" width="29" height="40" rx="6" fill="#DFF4EF"/>
        <text x="24.5" y="107" text-anchor="middle" fill="#31A98F" font-size="8" font-weight="800">MD</text>
        <text x="50" y="97" fill="#30394B" font-size="9.5" font-weight="700">课堂笔记</text>
        <text x="50" y="114" fill="#8C96A5" font-size="8.5">矩阵乘法示例</text>
        <rect y="144" width="167" height="62" rx="11" fill="#F6F8FC" stroke="#E1E6EF"/>
        <rect x="10" y="155" width="29" height="40" rx="6" fill="#FDEDD8"/>
        <text x="24.5" y="179" text-anchor="middle" fill="#D88932" font-size="8" font-weight="800">DOC</text>
        <text x="50" y="169" fill="#30394B" font-size="9.5" font-weight="700">习题与解析</text>
        <text x="50" y="186" fill="#8C96A5" font-size="8.5">例题 08—15</text>
      </g>
      <rect x="458" y="430" width="167" height="31" rx="9" fill="#EEF1FF"/>
      <text x="541.5" y="450" text-anchor="middle" fill="#586BE6" font-size="9.5" font-weight="700">打开资料书架</text>
    </g>
