name: Version and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose assets should be built and uploaded
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_please:
    name: Manage version
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build / ${{ matrix.name }}
    if: >-
      always() && (needs.release_please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    needs: release_please
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-x64
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macos-x64
            os: macos-14
            bundles: dmg
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release_please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: python -m pip install -e '.[dev]'
      - run: npm run check:versions
      - run: npm run build:backend-runtime
      - run: python scripts/check_packaged_worker.py
      - run: node ./node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: studypilot-${{ matrix.name }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release_please.outputs.tag_name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 30

  publish_assets:
    name: Publish GitHub Release assets
    if: >-
      always() && (needs.release_please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    needs: [release_please, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Upload packaged applications
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release_please.outputs.tag_name }}
        shell: bash
        run: |
          while IFS= read -r -d '' asset; do
            gh release upload "$RELEASE_TAG" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          done < <(find release-assets -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -print0)
